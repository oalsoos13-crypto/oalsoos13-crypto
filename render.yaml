# Render.com Blueprint — one-click deploy of the UDC Debit Note System.
# In Render: New + → "Blueprint" → connect this repo → it reads this file.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: udc-debit-note-system
    runtime: node
    plan: starter            # a persistent disk requires a paid instance (Starter+)
    region: frankfurt        # pick the closest region (frankfurt is nearest to Kuwait)
    branch: claude/oalsoos13-crypto-analysis-lbunyk
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true   # Render generates a strong random secret
      - key: DB_FILE
        value: /data/udc.db    # store the SQLite file on the persistent disk
      - key: REF_YEAR
        value: "2026"
      - key: START_COUNTER
        value: "11251"
      # Set your own strong values in the Render dashboard (kept out of the repo).
      # If left unset, the app falls back to its built-in defaults and every user
      # is still forced to change the password on first login.
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEFAULT_PASSWORD
        sync: false
    disk:
      name: udc-data
      mountPath: /data         # DB_FILE lives here so data survives restarts/deploys
      sizeGB: 1
